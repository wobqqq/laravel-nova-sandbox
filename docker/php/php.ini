[PHP]
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
date.timezone = UTC
expose_php = Off

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

[pcov]
pcov.enabled = 1
pcov.directory = /var/www/portfolio/laravel-nova-sandbox/app
