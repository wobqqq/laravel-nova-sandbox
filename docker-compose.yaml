name: nova-sandbox

services:
    nginx:
        container_name: nova-sandbox-nginx
        image: nginx:1.29-alpine
        restart: unless-stopped
        ports:
            - ${APP_PORT:-8081}:80
        volumes:
            - ..:/var/www/portfolio
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php

    php:
        container_name: nova-sandbox-php
        image: nova-sandbox/php:latest
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        restart: unless-stopped
        volumes:
            - ..:/var/www/portfolio
            - composer-cache:/home/www-data/.composer/cache
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started

    mysql:
        container_name: nova-sandbox-mysql
        image: mysql:8.4
        restart: unless-stopped
        ports:
            - ${DB_FORWARD_PORT:-33061}:3306
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-sandbox}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - mysql:/var/lib/mysql
            - ./docker/mysql/create-test-database.sql:/docker-entrypoint-initdb.d/10-create-test-database.sql:ro
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-p${DB_PASSWORD:-secret}']
            interval: 5s
            timeout: 5s
            retries: 30

    redis:
        container_name: nova-sandbox-redis
        image: redis:8-alpine
        restart: unless-stopped
        ports:
            - ${REDIS_FORWARD_PORT:-63791}:6379

    mailpit:
        container_name: nova-sandbox-mailpit
        image: axllent/mailpit:latest
        restart: unless-stopped
        ports:
            - ${MAILPIT_UI_PORT:-8026}:8025
            - ${MAILPIT_SMTP_PORT:-1026}:1025

volumes:
    mysql: ~
    composer-cache: ~
